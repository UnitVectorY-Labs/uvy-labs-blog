title: UnitVectorY-Labs Blog
description: >-
  Release announcements and engineering updates from UnitVectorY-Labs.
baseurl: ""
url: "https://blog.unitvectorylabs.com"
lang: en
timezone: America/New_York
future: true

author: UnitVectorY-Labs
github_username: UnitVectorY-Labs
repository: UnitVectorY-Labs/uvy-labs-blog

plugins:
  - jekyll-feed
  - jekyll-paginate-v2
  - jekyll-seo-tag
  - jekyll-sitemap

pagination:
  enabled: true
  per_page: 12
  permalink: "/page/:num/"
  title: ":title — Page :num"
  sort_field: "date"
  sort_reverse: true
  trail:
    before: 2
    after: 2

autopages:
  enabled: true
  categories:
    enabled: false
  collections:
    enabled: false
  tags:
    enabled: true
    layouts:
      - "tag.html"
    title: ":tag"
    permalink: "/tags/:tag/"
    slugify:
      mode: "default"
      cased: true

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  auto_ids: true

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "UnitVectorY-Labs"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - justfile
  - node_modules
  - scripts/
  - vendor/
  - .bundle/
  - .sass-cache/
  - .jekyll-cache/
  - _site/
